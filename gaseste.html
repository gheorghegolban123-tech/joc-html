<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Găsește Dinozaurii</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@600;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #1e3320;
      --panel: rgba(255, 252, 240, 0.94);
      --accent: #e85d2c;
      --accent-dark: #c4471a;
      --good: #2f9e44;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      font-family: "Nunito", system-ui, sans-serif;
      color: var(--ink);
      background: #1a2e14;
      display: grid;
      place-items: center;
      padding: 0.75rem;
    }

    .wrap {
      width: min(100%, 520px);
      display: grid;
      gap: 0.7rem;
    }

    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .back {
      font-family: "Baloo 2", cursive;
      font-weight: 700;
      color: #e8f5d8;
      text-decoration: none;
      background: #2a4a22cc;
      border: 2px solid #ffffff33;
      border-radius: 999px;
      padding: 0.3rem 0.85rem;
    }

    h1 {
      font-family: "Baloo 2", cursive;
      font-size: clamp(1.4rem, 5vw, 1.9rem);
      color: #f3ffe8;
      text-shadow: 0 2px 0 #0006;
    }

    .hud {
      display: flex;
      gap: 0.45rem;
      font-weight: 800;
      font-size: 0.9rem;
    }

    .hud span {
      background: var(--panel);
      border: 3px solid #2a3d1f44;
      border-radius: 999px;
      padding: 0.3rem 0.75rem;
    }

    .stage {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 5;
      border-radius: 1.1rem;
      overflow: hidden;
      border: 4px solid #143018;
      box-shadow: 0 12px 0 #0d1f1088, 0 18px 40px #0006;
      background:
        url("assets/leaves/forest1.jpg") center / cover no-repeat;
      cursor: crosshair;
      user-select: none;
      touch-action: manipulation;
    }

    .leaf-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        url("assets/leaves/leaves1.jpg") 10% 20% / 70% auto no-repeat,
        url("assets/leaves/forest2.jpg") 80% 70% / 75% auto no-repeat;
      opacity: 0.72;
      mix-blend-mode: multiply;
    }

    .leaf-layer.top {
      opacity: 0.55;
      mix-blend-mode: normal;
      background:
        radial-gradient(circle at 20% 30%, transparent 8%, #0d2a1288 9%, transparent 40%),
        radial-gradient(circle at 70% 55%, transparent 7%, #14381899 8%, transparent 35%),
        radial-gradient(circle at 45% 80%, transparent 9%, #0f281099 10%, transparent 42%),
        url("assets/leaves/forest2.jpg") center / cover no-repeat;
      opacity: 0.45;
    }

    .dino {
      position: absolute;
      width: 22%;
      aspect-ratio: 1;
      object-fit: contain;
      opacity: 0.42;
      filter: saturate(0.85) brightness(0.92) contrast(1.05);
      transition: opacity 0.25s ease, transform 0.25s ease, filter 0.25s ease;
      cursor: pointer;
      z-index: 2;
      -webkit-tap-highlight-color: transparent;
    }

    .dino:nth-child(odd) { opacity: 0.38; }
    .dino:nth-child(3n) { opacity: 0.48; }

    .dino.found {
      opacity: 1 !important;
      filter: none;
      transform: scale(1.08);
      z-index: 5;
      animation: found-pop 0.45s cubic-bezier(0.34, 1.45, 0.64, 1);
      pointer-events: none;
      outline: 3px solid #ffe066;
      outline-offset: 2px;
      border-radius: 12px;
      background: #ffffff33;
    }

    @keyframes found-pop {
      from { transform: scale(0.85); }
      to { transform: scale(1.08); }
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      background: rgba(20, 40, 18, 0.55);
      z-index: 20;
      padding: 1rem;
      text-align: center;
    }

    .overlay.hidden {
      display: none;
    }

    .overlay.celebrate {
      background: rgba(15, 25, 40, 0.28);
      pointer-events: none;
    }

    .overlay.celebrate .panel {
      pointer-events: auto;
    }

    .panel {
      background: var(--panel);
      border: 4px solid var(--ink);
      border-radius: 1.1rem;
      padding: 1.2rem 1rem;
      width: min(100%, 300px);
      box-shadow: 0 8px 0 #2a3d1f44;
      animation: pop-in 0.35s cubic-bezier(0.34, 1.4, 0.64, 1);
    }

    @keyframes pop-in {
      from { transform: scale(0.85); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .panel h2 {
      font-family: "Baloo 2", cursive;
      font-size: 1.7rem;
      color: var(--accent-dark);
      margin-bottom: 0.35rem;
    }

    .panel p {
      margin-bottom: 1rem;
      line-height: 1.35;
    }

    button {
      font-family: "Baloo 2", cursive;
      font-size: 1.15rem;
      font-weight: 700;
      border: none;
      border-radius: 999px;
      padding: 0.55rem 1.4rem;
      background: linear-gradient(180deg, #ff8a4c, var(--accent));
      color: #fff;
      cursor: pointer;
      box-shadow: 0 5px 0 var(--accent-dark);
    }

    button:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 var(--accent-dark);
    }

    .hint {
      text-align: center;
      color: #d8ecc8;
      font-weight: 700;
      font-size: 0.88rem;
    }

    .miss {
      position: absolute;
      pointer-events: none;
      font-family: "Baloo 2", cursive;
      font-size: 0.95rem;
      color: #fff;
      text-shadow: 0 2px 4px #000a;
      z-index: 8;
      animation: miss-fade 0.7s ease forwards;
    }

    @keyframes miss-fade {
      from { opacity: 1; transform: translateY(0); }
      to { opacity: 0; transform: translateY(-18px); }
    }

    canvas#fx {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 15;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <a class="back" href="index.html">← Meniu</a>
      <h1>🍃 Găsește Dinozaurii</h1>
    </div>

    <div class="hud">
      <span id="foundCount">Găsiți: 0 / 5</span>
      <span id="tries">Încercări: 0</span>
    </div>

    <div class="stage" id="stage">
      <img class="dino" data-id="0" src="assets/dinos/dino-trex.png" alt="T-Rex" style="left:8%; top:12%; width:24%; transform: rotate(-8deg);" />
      <img class="dino" data-id="1" src="assets/dinos/dino-triceratops.png" alt="Triceratops" style="left:58%; top:18%; width:26%; transform: rotate(12deg);" />
      <img class="dino" data-id="2" src="assets/dinos/dino-stego.png" alt="Stegosaurus" style="left:28%; top:42%; width:23%; transform: rotate(-4deg);" />
      <img class="dino" data-id="3" src="assets/dinos/dino-brachio.png" alt="Brachiosaurus" style="left:62%; top:52%; width:28%; transform: rotate(6deg);" />
      <img class="dino" data-id="4" src="assets/dinos/dino-raptor.png" alt="Raptor" style="left:12%; top:62%; width:22%; transform: rotate(-14deg);" />

      <div class="leaf-layer" aria-hidden="true"></div>
      <div class="leaf-layer top" aria-hidden="true"></div>
      <canvas id="fx" width="520" height="650"></canvas>

      <div class="overlay" id="startScreen">
        <div class="panel">
          <h2>Gata de căutat!</h2>
          <p>Apasă <strong>Start</strong>, apoi dă click pe dinozaurii ascunși printre frunze. Se văd puțin — uită-te bine!</p>
          <button type="button" id="startBtn">Start</button>
        </div>
      </div>

      <div class="overlay hidden celebrate" id="endScreen">
        <div class="panel">
          <h2 id="endTitle">Bravo!</h2>
          <p id="endMsg">I-ai găsit pe toți!</p>
          <button type="button" id="againBtn">Joacă din nou</button>
        </div>
      </div>
    </div>

    <p class="hint">Apasă pe dinozaurii pe care îi zărești printre frunze</p>
  </div>

  <script>
    const TOTAL = 5;
    const dinos = [...document.querySelectorAll(".dino")];
    const foundEl = document.getElementById("foundCount");
    const triesEl = document.getElementById("tries");
    const startScreen = document.getElementById("startScreen");
    const endScreen = document.getElementById("endScreen");
    const stage = document.getElementById("stage");
    const fx = document.getElementById("fx");
    const ctx = fx.getContext("2d");

    let playing = false;
    let found = 0;
    let tries = 0;
    let foundSet = new Set();
    let fireworks = [];
    let fireworkTimer = 0;
    let celebrating = false;
    let lastTime = 0;

    const FW_COLORS = ["#ff6b6b", "#ffd43b", "#69db7c", "#74c0fc", "#b197fc", "#ffa94d", "#fff"];

    function resizeFx() {
      const r = stage.getBoundingClientRect();
      fx.width = Math.round(r.width);
      fx.height = Math.round(r.height);
    }

    function updateHud() {
      foundEl.textContent = `Găsiți: ${found} / ${TOTAL}`;
      triesEl.textContent = `Încercări: ${tries}`;
    }

    function resetGame() {
      found = 0;
      tries = 0;
      foundSet.clear();
      celebrating = false;
      fireworks = [];
      dinos.forEach((d) => d.classList.remove("found"));
      endScreen.classList.add("hidden");
      updateHud();
    }

    function start() {
      resetGame();
      startScreen.classList.add("hidden");
      playing = true;
      resizeFx();
      lastTime = performance.now();
    }

    function showMiss(x, y) {
      const el = document.createElement("div");
      el.className = "miss";
      el.textContent = "Hmm…";
      el.style.left = `${x}px`;
      el.style.top = `${y}px`;
      stage.appendChild(el);
      setTimeout(() => el.remove(), 700);
    }

    function launchFirework(x, y) {
      const color = FW_COLORS[Math.floor(Math.random() * FW_COLORS.length)];
      for (let i = 0; i < 42; i++) {
        const a = (Math.PI * 2 * i) / 42 + Math.random() * 0.2;
        const s = 70 + Math.random() * 140;
        fireworks.push({
          x, y,
          vx: Math.cos(a) * s,
          vy: Math.sin(a) * s,
          life: 0.9 + Math.random() * 0.5,
          maxLife: 1.2,
          color,
          size: 2 + Math.random() * 2.5,
        });
      }
    }

    function win() {
      playing = false;
      celebrating = true;
      fireworkTimer = 0;
      document.getElementById("endTitle").textContent = "Bravo!";
      document.getElementById("endMsg").textContent =
        `I-ai găsit pe toți cei ${TOTAL} dinozauri în ${tries} încercări!`;
      endScreen.classList.remove("hidden");
      launchFirework(fx.width * 0.3, fx.height * 0.3);
      launchFirework(fx.width * 0.7, fx.height * 0.25);
      launchFirework(fx.width * 0.5, fx.height * 0.4);
    }

    dinos.forEach((dino) => {
      dino.addEventListener("click", (e) => {
        e.stopPropagation();
        if (!playing || foundSet.has(dino.dataset.id)) return;
        tries += 1;
        found += 1;
        foundSet.add(dino.dataset.id);
        dino.classList.add("found");
        updateHud();
        if (found >= TOTAL) win();
      });
    });

    stage.addEventListener("click", (e) => {
      if (!playing) return;
      if (e.target.classList.contains("dino")) return;
      tries += 1;
      updateHud();
      const r = stage.getBoundingClientRect();
      showMiss(e.clientX - r.left - 10, e.clientY - r.top - 10);
    });

    document.getElementById("startBtn").addEventListener("click", start);
    document.getElementById("againBtn").addEventListener("click", start);

    function loop(ts) {
      const dt = Math.min(0.033, (ts - lastTime) / 1000 || 0.016);
      lastTime = ts;

      ctx.clearRect(0, 0, fx.width, fx.height);

      if (celebrating) {
        fireworkTimer -= dt;
        if (fireworkTimer <= 0) {
          launchFirework(40 + Math.random() * (fx.width - 80), 40 + Math.random() * (fx.height * 0.5));
          fireworkTimer = 0.3 + Math.random() * 0.35;
        }

        for (let i = fireworks.length - 1; i >= 0; i--) {
          const f = fireworks[i];
          f.life -= dt;
          f.x += f.vx * dt;
          f.y += f.vy * dt;
          f.vy += 90 * dt;
          if (f.life <= 0) {
            fireworks.splice(i, 1);
            continue;
          }
          ctx.globalAlpha = Math.max(0, f.life / f.maxLife);
          ctx.fillStyle = f.color;
          ctx.beginPath();
          ctx.arc(f.x, f.y, f.size, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalAlpha = 1;
      }

      requestAnimationFrame(loop);
    }

    window.addEventListener("resize", resizeFx);
    resizeFx();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
