<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Jocuri cu Dinozauri</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@600;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --sky-top: #7ec8f5;
      --sky-mid: #b8e4a8;
      --sky-bot: #f0d78c;
      --ink: #2a3d1f;
      --panel: rgba(255, 252, 240, 0.94);
      --accent: #e85d2c;
      --accent-dark: #c4471a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      font-family: "Nunito", system-ui, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(ellipse 80% 50% at 20% 10%, #fff6c8 0%, transparent 55%),
        linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 55%, var(--sky-bot) 100%);
      display: grid;
      place-items: center;
      padding: 1rem;
    }

    .wrap {
      width: min(100%, 460px);
      display: grid;
      gap: 1rem;
    }

    h1 {
      font-family: "Baloo 2", cursive;
      font-weight: 800;
      font-size: clamp(1.9rem, 6vw, 2.5rem);
      text-align: center;
      color: #1f4d12;
      text-shadow: 0 2px 0 #fff8;
      animation: title-bounce 2.4s ease-in-out infinite;
    }

    @keyframes title-bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }

    .screen {
      background: var(--panel);
      border: 4px solid var(--ink);
      border-radius: 1.25rem;
      padding: 1.4rem 1.2rem;
      box-shadow: 0 10px 0 #2a3d1f33;
      text-align: center;
      animation: pop-in 0.35s cubic-bezier(0.34, 1.4, 0.64, 1);
    }

    .screen.hidden { display: none; }

    @keyframes pop-in {
      from { transform: scale(0.9); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .screen h2 {
      font-family: "Baloo 2", cursive;
      font-size: 2rem;
      color: var(--accent-dark);
      margin-bottom: 0.4rem;
    }

    .screen p {
      margin-bottom: 1.1rem;
      line-height: 1.4;
      opacity: 0.92;
    }

    button, .game-card {
      font-family: "Baloo 2", cursive;
      cursor: pointer;
      border: none;
    }

    .btn {
      font-size: 1.2rem;
      font-weight: 700;
      border-radius: 999px;
      padding: 0.6rem 1.5rem;
      background: linear-gradient(180deg, #ff8a4c, var(--accent));
      color: #fff;
      box-shadow: 0 5px 0 var(--accent-dark);
    }

    .btn:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 var(--accent-dark);
    }

    .games {
      display: grid;
      gap: 0.85rem;
    }

    .game-card {
      display: grid;
      gap: 0.25rem;
      text-align: left;
      padding: 1rem 1.05rem;
      border-radius: 1rem;
      border: 3px solid var(--ink);
      background: linear-gradient(135deg, #fff 0%, #e8f8d8 100%);
      box-shadow: 0 5px 0 #2a3d1f33;
      text-decoration: none;
      color: inherit;
      transition: transform 0.12s ease;
    }

    .game-card:hover { transform: translateY(-2px); }
    .game-card:active { transform: translateY(2px); box-shadow: 0 2px 0 #2a3d1f33; }

    .game-card strong {
      font-family: "Baloo 2", cursive;
      font-size: 1.25rem;
    }

    .game-card span {
      font-size: 0.92rem;
      opacity: 0.85;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>🦕 Jocuri cu Dinozauri</h1>

    <div class="screen" id="intro">
      <h2>Salut! 👋</h2>
      <p>Apasă butonul <strong>Start</strong> pentru a începe, apoi alege jocul dorit.</p>
      <button type="button" class="btn" id="startBtn">Start</button>
    </div>

    <div class="screen hidden" id="menu">
      <h2>Alege un joc</h2>
      <p>Cu ce vrei să te joci?</p>
      <div class="games">
        <a class="game-card" href="prinde.html">
          <strong>🧺 Prinde Dinozaurii</strong>
          <span>Mișcă coșul și prinde dinozaurii. Evită pietrele!</span>
        </a>
        <a class="game-card" href="gaseste.html">
          <strong>🍃 Găsește Dinozaurii</strong>
          <span>Caută dinozaurii ascunși printre frunze. Apasă pe ei!</span>
        </a>
      </div>
    </div>
  </div>

  <script>
    document.getElementById("startBtn").addEventListener("click", () => {
      document.getElementById("intro").classList.add("hidden");
      document.getElementById("menu").classList.remove("hidden");
    });
  </script>
</body>
</html>
