<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Prinde Dinozaurii</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@600;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --sky-top: #7ec8f5;
      --sky-mid: #b8e4a8;
      --sky-bot: #f0d78c;
      --grass: #5aad3a;
      --grass-dark: #3f8a28;
      --ink: #2a3d1f;
      --panel: rgba(255, 252, 240, 0.92);
      --accent: #e85d2c;
      --accent-dark: #c4471a;
      --good: #2f9e44;
      --warn: #e67700;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: "Nunito", system-ui, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(ellipse 80% 50% at 20% 10%, #fff6c8 0%, transparent 55%),
        radial-gradient(ellipse 60% 40% at 85% 20%, #ffffff88 0%, transparent 50%),
        linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 55%, var(--sky-bot) 100%);
      display: grid;
      place-items: center;
      padding: 1rem;
      overflow: hidden;
    }

    .wrap {
      width: min(100%, 440px);
      display: grid;
      gap: 0.85rem;
    }

    h1 {
      font-family: "Baloo 2", cursive;
      font-weight: 800;
      font-size: clamp(1.8rem, 6vw, 2.4rem);
      text-align: center;
      letter-spacing: 0.02em;
      color: #1f4d12;
      text-shadow: 0 2px 0 #fff8;
      animation: title-bounce 2.4s ease-in-out infinite;
    }

    @keyframes title-bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }

    .hud {
      display: flex;
      justify-content: space-between;
      gap: 0.5rem;
      font-weight: 800;
      font-size: 0.95rem;
    }

    .hud span {
      background: var(--panel);
      border: 3px solid #2a3d1f33;
      border-radius: 999px;
      padding: 0.35rem 0.85rem;
      box-shadow: 0 3px 0 #2a3d1f22;
    }

    .stage-shell {
      position: relative;
      border-radius: 1.25rem;
      overflow: hidden;
      border: 4px solid #2a3d1f;
      box-shadow:
        0 10px 0 #2a3d1f33,
        0 18px 40px #1a2a1033;
      background: linear-gradient(180deg, #8fd3f8 0%, #c8eb9a 70%, var(--grass) 70%, var(--grass-dark) 100%);
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      touch-action: none;
      cursor: none;
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      background: rgba(30, 50, 20, 0.55);
      backdrop-filter: blur(2px);
      padding: 1.25rem;
      text-align: center;
      transition: opacity 0.25s ease, visibility 0.25s ease;
    }

    .overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .overlay.celebrate {
      background: rgba(20, 30, 50, 0.28);
      backdrop-filter: none;
    }

    .panel {
      background: var(--panel);
      border: 4px solid var(--ink);
      border-radius: 1.1rem;
      padding: 1.25rem 1.1rem;
      width: min(100%, 300px);
      box-shadow: 0 8px 0 #2a3d1f44;
      animation: pop-in 0.35s cubic-bezier(0.34, 1.4, 0.64, 1);
    }

    .panel .hello {
      font-size: 2rem;
      margin-bottom: 0.15rem;
    }

    @keyframes pop-in {
      from { transform: scale(0.85); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .panel h2 {
      font-family: "Baloo 2", cursive;
      font-size: 1.65rem;
      margin-bottom: 0.35rem;
      color: var(--accent-dark);
    }

    .panel p {
      font-size: 0.95rem;
      line-height: 1.35;
      margin-bottom: 1rem;
      opacity: 0.9;
    }

    button {
      font-family: "Baloo 2", cursive;
      font-size: 1.15rem;
      font-weight: 700;
      border: none;
      border-radius: 999px;
      padding: 0.55rem 1.4rem;
      background: linear-gradient(180deg, #ff8a4c, var(--accent));
      color: #fff;
      cursor: pointer;
      box-shadow: 0 5px 0 var(--accent-dark);
      transition: transform 0.1s ease, box-shadow 0.1s ease;
    }

    button:hover {
      transform: translateY(-1px);
    }

    button:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 var(--accent-dark);
    }

    .hint {
      text-align: center;
      font-size: 0.85rem;
      font-weight: 700;
      color: #1f4d12cc;
    }

    .back {
      display: inline-block;
      text-align: center;
      font-family: "Baloo 2", cursive;
      font-weight: 700;
      color: #1f4d12;
      text-decoration: none;
      background: rgba(255, 252, 240, 0.9);
      border: 3px solid #2a3d1f33;
      border-radius: 999px;
      padding: 0.35rem 0.9rem;
      justify-self: start;
    }

    .cloud {
      position: fixed;
      width: 90px;
      height: 36px;
      background: #fff;
      border-radius: 40px;
      opacity: 0.55;
      pointer-events: none;
      z-index: -1;
      animation: drift linear infinite;
    }

    .cloud::before,
    .cloud::after {
      content: "";
      position: absolute;
      background: #fff;
      border-radius: 50%;
    }

    .cloud::before {
      width: 42px;
      height: 42px;
      top: -18px;
      left: 12px;
    }

    .cloud::after {
      width: 55px;
      height: 55px;
      top: -24px;
      left: 34px;
    }

    @keyframes drift {
      from { transform: translateX(-120px); }
      to { transform: translateX(calc(100vw + 120px)); }
    }
  </style>
</head>
<body>
  <div class="cloud" style="top: 12%; animation-duration: 28s;"></div>
  <div class="cloud" style="top: 28%; width: 70px; animation-duration: 36s; animation-delay: -12s;"></div>
  <div class="cloud" style="top: 8%; width: 110px; animation-duration: 42s; animation-delay: -20s;"></div>

  <div class="wrap">
    <a class="back" href="index.html">← Meniu</a>
    <h1>🦕 Prinde Dinozaurii</h1>
    <div class="hud">
      <span id="score">Scor: 0</span>
      <span id="lives">Vieți: ❤️❤️❤️</span>
      <span id="level">Nivel: 1</span>
    </div>

    <div class="stage-shell">
      <canvas id="game" width="400" height="520" aria-label="Zona de joc"></canvas>

      <div class="overlay" id="startScreen">
        <div class="panel">
          <h2 class="hello">Gata de joacă!</h2>
          <p>Apasă <strong>Start</strong>. Prinde dinozaurii și evită pietrele!</p>
          <button type="button" id="startBtn">Start</button>
        </div>
      </div>

      <div class="overlay hidden celebrate" id="endScreen">
        <div class="panel">
          <h2 id="endTitle">Gata!</h2>
          <p id="endMsg">Ai prins 0 dinozauri.</p>
          <button type="button" id="againBtn">Joacă din nou</button>
        </div>
      </div>
    </div>

    <p class="hint">← → sau mouse / deget pentru a mișca coșul</p>
  </div>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const scoreEl = document.getElementById("score");
    const livesEl = document.getElementById("lives");
    const levelEl = document.getElementById("level");
    const startScreen = document.getElementById("startScreen");
    const endScreen = document.getElementById("endScreen");
    const endTitle = document.getElementById("endTitle");
    const endMsg = document.getElementById("endMsg");

    const W = canvas.width;
    const H = canvas.height;
    const GROUND = H * 0.78;

    let running = false;
    let celebrating = false;
    let score = 0;
    let lives = 3;
    let level = 1;
    let items = [];
    let particles = [];
    let fireworks = [];
    let fireworkTimer = 0;
    let spawnTimer = 0;
    let keys = { left: false, right: false };
    let lastTime = 0;

    const FW_COLORS = ["#ff6b6b", "#ffd43b", "#69db7c", "#74c0fc", "#b197fc", "#ffa94d", "#f783ac", "#fff"];

    const basket = {
      x: W / 2,
      y: GROUND + 18,
      w: 78,
      h: 36,
      speed: 340,
    };

    function resetGame() {
      score = 0;
      lives = 3;
      level = 1;
      items = [];
      particles = [];
      fireworks = [];
      celebrating = false;
      fireworkTimer = 0;
      spawnTimer = 0;
      basket.x = W / 2;
      updateHud();
    }

    function launchFirework(x, y) {
      const color = FW_COLORS[Math.floor(Math.random() * FW_COLORS.length)];
      const count = 36 + Math.floor(Math.random() * 20);
      for (let i = 0; i < count; i++) {
        const a = (Math.PI * 2 * i) / count + Math.random() * 0.2;
        const s = 80 + Math.random() * 160;
        fireworks.push({
          x, y,
          vx: Math.cos(a) * s,
          vy: Math.sin(a) * s,
          life: 0.9 + Math.random() * 0.6,
          maxLife: 1.2,
          color,
          size: 2 + Math.random() * 2.5,
          trail: Math.random() > 0.55,
        });
      }
      // secondary sparkle ring
      const color2 = FW_COLORS[Math.floor(Math.random() * FW_COLORS.length)];
      for (let i = 0; i < 18; i++) {
        const a = Math.random() * Math.PI * 2;
        const s = 40 + Math.random() * 70;
        fireworks.push({
          x, y,
          vx: Math.cos(a) * s,
          vy: Math.sin(a) * s,
          life: 0.5 + Math.random() * 0.4,
          maxLife: 0.8,
          color: color2,
          size: 1.5 + Math.random() * 1.5,
          trail: false,
        });
      }
    }

    function updateFireworks(dt) {
      if (!celebrating) return;

      fireworkTimer -= dt;
      if (fireworkTimer <= 0) {
        launchFirework(40 + Math.random() * (W - 80), 60 + Math.random() * (H * 0.45));
        fireworkTimer = 0.28 + Math.random() * 0.35;
      }

      for (let i = fireworks.length - 1; i >= 0; i--) {
        const f = fireworks[i];
        f.life -= dt;
        f.x += f.vx * dt;
        f.y += f.vy * dt;
        f.vy += 90 * dt;
        f.vx *= 0.985;
        if (f.life <= 0) fireworks.splice(i, 1);
      }
    }

    function drawFireworks() {
      for (const f of fireworks) {
        const alpha = Math.max(0, f.life / f.maxLife);
        ctx.globalAlpha = alpha;
        ctx.fillStyle = f.color;
        ctx.beginPath();
        ctx.arc(f.x, f.y, f.size, 0, Math.PI * 2);
        ctx.fill();
        if (f.trail) {
          ctx.strokeStyle = f.color;
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.moveTo(f.x, f.y);
          ctx.lineTo(f.x - f.vx * 0.04, f.y - f.vy * 0.04);
          ctx.stroke();
        }
      }
      ctx.globalAlpha = 1;
    }

    function updateHud() {
      scoreEl.textContent = `Scor: ${score}`;
      livesEl.textContent = `Vieți: ${"❤️".repeat(lives)}${"🖤".repeat(3 - lives)}`;
      levelEl.textContent = `Nivel: ${level}`;
    }

    function spawnItem() {
      const isRock = Math.random() < Math.min(0.12 + level * 0.03, 0.35);
      items.push({
        x: 28 + Math.random() * (W - 56),
        y: -30,
        r: isRock ? 16 : 20,
        vy: 110 + level * 18 + Math.random() * 40,
        type: isRock ? "rock" : "dino",
        spin: Math.random() * Math.PI * 2,
        spinSpeed: (Math.random() - 0.5) * 3,
        hue: Math.floor(Math.random() * 5),
      });
    }

    function burst(x, y, color) {
      for (let i = 0; i < 10; i++) {
        const a = Math.random() * Math.PI * 2;
        const s = 40 + Math.random() * 90;
        particles.push({
          x, y,
          vx: Math.cos(a) * s,
          vy: Math.sin(a) * s,
          life: 0.45 + Math.random() * 0.25,
          color,
        });
      }
    }

    function drawSky() {
      const g = ctx.createLinearGradient(0, 0, 0, H);
      g.addColorStop(0, "#7ec8f5");
      g.addColorStop(0.65, "#c8eb9a");
      g.addColorStop(0.7, "#5aad3a");
      g.addColorStop(1, "#3f8a28");
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);

      // sun
      ctx.beginPath();
      ctx.fillStyle = "#ffe066";
      ctx.arc(330, 70, 34, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.fillStyle = "#fff3a3aa";
      ctx.arc(330, 70, 48, 0, Math.PI * 2);
      ctx.fill();

      // grass tufts
      ctx.fillStyle = "#4a9a30";
      for (let i = 0; i < 12; i++) {
        const x = 18 + i * 34;
        ctx.beginPath();
        ctx.moveTo(x, GROUND + 8);
        ctx.quadraticCurveTo(x + 6, GROUND - 10, x + 12, GROUND + 8);
        ctx.fill();
      }
    }

    function drawBasket() {
      const { x, y, w, h } = basket;
      ctx.save();
      ctx.translate(x, y);

      // body
      ctx.fillStyle = "#c47a2c";
      ctx.beginPath();
      ctx.moveTo(-w / 2, -h / 2);
      ctx.lineTo(w / 2, -h / 2);
      ctx.lineTo(w / 2 - 8, h / 2);
      ctx.lineTo(-w / 2 + 8, h / 2);
      ctx.closePath();
      ctx.fill();

      ctx.strokeStyle = "#8a5520";
      ctx.lineWidth = 3;
      ctx.stroke();

      // weave lines
      ctx.strokeStyle = "#a86624";
      ctx.lineWidth = 2;
      for (let i = -1; i <= 1; i++) {
        ctx.beginPath();
        ctx.moveTo(i * 18, -h / 2 + 4);
        ctx.lineTo(i * 14, h / 2 - 2);
        ctx.stroke();
      }

      // handle
      ctx.beginPath();
      ctx.strokeStyle = "#8a5520";
      ctx.lineWidth = 4;
      ctx.arc(0, -h / 2 - 2, 22, Math.PI, 0);
      ctx.stroke();

      ctx.restore();
    }

    const DINO_COLORS = [
      { body: "#5c940d", belly: "#c0eb75", spots: "#2b8a3e" },
      { body: "#e67700", belly: "#ffd8a8", spots: "#d9480f" },
      { body: "#1971c2", belly: "#a5d8ff", spots: "#1864ab" },
      { body: "#9c36b5", belly: "#eebefa", spots: "#862e9c" },
      { body: "#0ca678", belly: "#96f2d7", spots: "#087f5b" },
    ];

    function drawDino(item) {
      const c = DINO_COLORS[item.hue % DINO_COLORS.length];
      const s = item.r / 18;
      ctx.save();
      ctx.translate(item.x, item.y);
      ctx.rotate(item.spin * 0.35);

      // tail
      ctx.fillStyle = c.body;
      ctx.beginPath();
      ctx.moveTo(-6 * s, 4 * s);
      ctx.quadraticCurveTo(-22 * s, 2 * s, -26 * s, -6 * s);
      ctx.quadraticCurveTo(-18 * s, 8 * s, -4 * s, 10 * s);
      ctx.fill();

      // body
      ctx.beginPath();
      ctx.ellipse(0, 4 * s, 14 * s, 11 * s, 0, 0, Math.PI * 2);
      ctx.fill();

      // belly
      ctx.fillStyle = c.belly;
      ctx.beginPath();
      ctx.ellipse(2 * s, 7 * s, 8 * s, 6 * s, 0, 0, Math.PI * 2);
      ctx.fill();

      // spots
      ctx.fillStyle = c.spots;
      ctx.beginPath();
      ctx.arc(-4 * s, 0, 2.2 * s, 0, Math.PI * 2);
      ctx.arc(4 * s, 2 * s, 1.8 * s, 0, Math.PI * 2);
      ctx.fill();

      // legs
      ctx.fillStyle = c.body;
      ctx.fillRect(-8 * s, 12 * s, 5 * s, 8 * s);
      ctx.fillRect(4 * s, 12 * s, 5 * s, 8 * s);

      // head
      ctx.beginPath();
      ctx.ellipse(12 * s, -6 * s, 10 * s, 8 * s, 0.15, 0, Math.PI * 2);
      ctx.fill();

      // snout
      ctx.beginPath();
      ctx.ellipse(20 * s, -4 * s, 7 * s, 5 * s, 0.1, 0, Math.PI * 2);
      ctx.fill();

      // jaw highlight
      ctx.fillStyle = c.belly;
      ctx.beginPath();
      ctx.ellipse(19 * s, -1 * s, 5 * s, 2.5 * s, 0.1, 0, Math.PI * 2);
      ctx.fill();

      // eye
      ctx.fillStyle = "#fff";
      ctx.beginPath();
      ctx.arc(14 * s, -9 * s, 3.2 * s, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#212529";
      ctx.beginPath();
      ctx.arc(15 * s, -9 * s, 1.6 * s, 0, Math.PI * 2);
      ctx.fill();

      // little arm
      ctx.fillStyle = c.body;
      ctx.beginPath();
      ctx.ellipse(6 * s, 2 * s, 3 * s, 2 * s, 0.5, 0, Math.PI * 2);
      ctx.fill();

      // back spikes
      ctx.beginPath();
      ctx.moveTo(-6 * s, -4 * s);
      ctx.lineTo(-2 * s, -14 * s);
      ctx.lineTo(2 * s, -5 * s);
      ctx.lineTo(6 * s, -12 * s);
      ctx.lineTo(10 * s, -4 * s);
      ctx.fill();

      ctx.restore();
    }

    function drawRock(item) {
      ctx.save();
      ctx.translate(item.x, item.y);
      ctx.rotate(item.spin);

      ctx.fillStyle = "#868e96";
      ctx.beginPath();
      ctx.moveTo(-item.r, 4);
      ctx.lineTo(-item.r + 4, -item.r + 2);
      ctx.lineTo(2, -item.r);
      ctx.lineTo(item.r, -2);
      ctx.lineTo(item.r - 2, item.r - 2);
      ctx.lineTo(-4, item.r);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = "#adb5bd";
      ctx.beginPath();
      ctx.ellipse(-4, -2, 5, 3.5, 0.2, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    function drawParticles(dt) {
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.life -= dt;
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.vy += 180 * dt;
        if (p.life <= 0) {
          particles.splice(i, 1);
          continue;
        }
        ctx.globalAlpha = Math.max(0, p.life * 2);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 3.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
      }
    }

    function update(dt) {
      if (!running) return;

      let dir = 0;
      if (keys.left) dir -= 1;
      if (keys.right) dir += 1;
      basket.x += dir * basket.speed * dt;
      basket.x = Math.max(basket.w / 2 + 4, Math.min(W - basket.w / 2 - 4, basket.x));

      spawnTimer -= dt;
      if (spawnTimer <= 0) {
        spawnItem();
        spawnTimer = Math.max(0.45, 1.15 - level * 0.08);
      }

      for (let i = items.length - 1; i >= 0; i--) {
        const it = items[i];
        it.y += it.vy * dt;
        it.spin += it.spinSpeed * dt;

        const catchY = basket.y - basket.h / 2;
        const inX = Math.abs(it.x - basket.x) < basket.w / 2 - 4;
        const inY = it.y + it.r > catchY && it.y < basket.y + 8;

        if (inX && inY) {
          if (it.type === "dino") {
            score += 1;
            burst(it.x, it.y, DINO_COLORS[it.hue % DINO_COLORS.length].body);
            if (score > 0 && score % 8 === 0) {
              level += 1;
            }
          } else {
            lives -= 1;
            burst(it.x, it.y, "#868e96");
          }
          items.splice(i, 1);
          updateHud();
          if (lives <= 0) gameOver();
          continue;
        }

        if (it.y - it.r > H) {
          if (it.type === "dino") {
            lives -= 1;
            updateHud();
            if (lives <= 0) gameOver();
          }
          items.splice(i, 1);
        }
      }
    }

    function draw() {
      drawSky();
      for (const it of items) {
        if (it.type === "dino") drawDino(it);
        else drawRock(it);
      }
      drawBasket();
      drawParticles(0); // positions already updated in loop
    }

    function gameOver() {
      running = false;
      celebrating = true;
      fireworkTimer = 0;
      items = [];
      endTitle.textContent = score >= 15 ? "Bravo!" : "Gata!";
      endMsg.textContent = `Ai prins ${score} ${score === 1 ? "dinozaur" : "dinozauri"}. Nivel maxim: ${level}.`;
      endScreen.classList.remove("hidden");
      // burst a few right away
      launchFirework(W * 0.3, H * 0.28);
      launchFirework(W * 0.7, H * 0.22);
      launchFirework(W * 0.5, H * 0.35);
    }

    function loop(ts) {
      const dt = Math.min(0.033, (ts - lastTime) / 1000 || 0.016);
      lastTime = ts;

      if (running) {
        update(dt);
        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.life -= dt;
          p.x += p.vx * dt;
          p.y += p.vy * dt;
          p.vy += 180 * dt;
          if (p.life <= 0) particles.splice(i, 1);
        }
      }

      updateFireworks(dt);

      drawSky();
      for (const it of items) {
        if (it.type === "dino") drawDino(it);
        else drawRock(it);
      }
      if (!celebrating) drawBasket();

      for (const p of particles) {
        ctx.globalAlpha = Math.max(0, p.life * 2);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 3.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
      }

      drawFireworks();

      requestAnimationFrame(loop);
    }

    function start() {
      resetGame();
      startScreen.classList.add("hidden");
      endScreen.classList.add("hidden");
      running = true;
      lastTime = performance.now();
    }

    document.getElementById("startBtn").addEventListener("click", start);
    document.getElementById("againBtn").addEventListener("click", start);

    window.addEventListener("keydown", (e) => {
      if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") keys.left = true;
      if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") keys.right = true;
      if ((e.key === "Enter" || e.key === " ") && !running) start();
    });

    window.addEventListener("keyup", (e) => {
      if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") keys.left = false;
      if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") keys.right = false;
    });

    function pointerToBasket(clientX) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = W / rect.width;
      basket.x = (clientX - rect.left) * scaleX;
      basket.x = Math.max(basket.w / 2 + 4, Math.min(W - basket.w / 2 - 4, basket.x));
    }

    canvas.addEventListener("pointermove", (e) => {
      if (!running) return;
      pointerToBasket(e.clientX);
    });

    canvas.addEventListener("pointerdown", (e) => {
      if (!running) return;
      canvas.setPointerCapture(e.pointerId);
      pointerToBasket(e.clientX);
    });

    // idle preview frame
    drawSky();
    drawBasket();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
